[project]
name = "gigapaper"
version = "0.1.0"
description = "Annotate and comment on research papers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "lxml-html-clean>=0.4.0",
    "markdown>=3.6",
]

[project.scripts]
gigapaper = "app.desktop:main"

[project.optional-dependencies]
snapshots = ["playwright>=1.40"]
desktop = ["pywebview>=5.0"]
build = ["pywebview>=5.0", "pyinstaller>=6.6"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the idiomatic pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
