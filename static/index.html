<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>gigapaper</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>gigapaper</h1>
        <button id="new-folder-btn" title="New folder">+ Folder</button>
      </div>
      <ul id="folder-list"></ul>
      <div class="sidebar-actions">
        <label id="upload-label" class="upload-label">
          <span id="upload-label-text">+ Import PDFs</span>
          <input id="upload-input" type="file" accept="application/pdf" multiple hidden />
        </label>
        <button id="import-url-btn">+ Import from URL</button>
      </div>
    </aside>
    <main id="main">
      <div id="paper-list-view">
        <div class="view-header">
          <h2 id="current-folder-title">All papers</h2>
          <p id="paper-count" class="label"></p>
          <div id="paper-filter" class="segmented" role="group" aria-label="Filter papers">
            <button data-filter="all" aria-pressed="true">All</button>
            <button data-filter="unread" aria-pressed="false">Unread</button>
          </div>
        </div>
        <ul id="paper-list"></ul>
        <p id="empty-state" class="hidden">No papers here yet. Import a PDF to start reading.</p>
      </div>
      <div id="viewer-view" class="hidden">
        <div id="viewer-toolbar">
          <button id="back-btn">&larr; Library</button>
          <span id="viewer-title"></span>
          <span id="viewer-pages" class="label"></span>
          <a id="viewer-source" class="label" target="_blank" rel="noopener noreferrer"></a>
          <div id="view-mode" class="segmented hidden" role="group" aria-label="View mode">
            <button data-mode="reader" aria-pressed="true">Reader</button>
            <button data-mode="original" aria-pressed="false">Original</button>
          </div>
          <span class="toolbar-spacer"></span>
          <button id="notes-toggle" aria-pressed="false"><span class="switch" aria-hidden="true"></span>View highlights</button>
          <button id="read-toggle" aria-pressed="false"><span class="check" aria-hidden="true">✓</span><span id="read-toggle-text">Mark as read</span></button>
        </div>
        <div id="viewer-body">
          <div id="pdf-container"></div>
          <aside id="notes-rail" class="hidden"></aside>
          <div id="original-view" class="hidden">
            <p id="original-note" class="label">Live page from its source. Highlights live in the reader view.</p>
            <iframe id="original-frame" title="Original page"
                    sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                    referrerpolicy="no-referrer"></iframe>
          </div>
        </div>
      </div>
    </main>
    <div id="comment-popover" class="hidden">
      <ul id="comment-list" class="hidden"></ul>
      <textarea id="comment-input" placeholder="Add a comment (optional)"></textarea>
      <div class="popover-actions">
        <button id="comment-delete" class="hidden" title="Delete highlight (Del)">Delete</button>
        <span class="popover-spacer"></span>
        <button id="comment-cancel" title="Cancel (Esc)">Cancel</button>
        <button id="comment-save" title="Save (Enter)">Save highlight</button>
      </div>
    </div>

    <div id="modal-overlay" class="hidden">
      <div id="modal-box">
        <p id="modal-message"></p>
        <input id="modal-input" type="text" />
        <div class="popover-actions">
          <button id="modal-confirm">OK</button>
          <button id="modal-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
